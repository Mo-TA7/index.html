
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONA LMS</title>

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
:root{
--primary:#2563EB;
--secondary:#7C3AED;
--success:#22C55E;
--danger:#EF4444;
--dark:#0F172A;
--gray:#64748B;
--light:#F8FAFC;
--white:#FFFFFF;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Cairo',sans-serif;
}

body{
background:#f5f7fb;
}

.container{
display:flex;
min-height:100vh;
}

.sidebar{
width:260px;
background:linear-gradient(180deg,var(--primary),var(--secondary));
color:white;
padding:25px;
}

.logo{
font-size:32px;
font-weight:700;
margin-bottom:30px;
text-align:center;
}

.menu{
list-style:none;
}

.menu li{
padding:14px;
border-radius:12px;
margin-bottom:10px;
cursor:pointer;
transition:.3s;
}

.menu li:hover{
background:rgba(255,255,255,.15);
}

.main{
flex:1;
padding:25px;
}

.topbar{
background:white;
padding:15px 20px;
border-radius:20px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 20px rgba(0,0,0,.06);
margin-bottom:25px;
}

.profile{
display:flex;
align-items:center;
gap:10px;
}

.avatar{
width:40px;
height:40px;
background:var(--primary);
border-radius:50%;
}

.cards{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:20px;
margin-bottom:25px;
}

.card{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 4px 20px rgba(0,0,0,.06);
}

.card h4{
color:var(--gray);
margin-bottom:10px;
}

.card .number{
font-size:28px;
font-weight:bold;
color:var(--dark);
}

.content-grid{
display:grid;
grid-template-columns:2fr 1fr;
gap:20px;
}

.panel{
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 4px 20px rgba(0,0,0,.06);
}

.panel h3{
margin-bottom:20px;
color:var(--dark);
}

.student{
display:flex;
justify-content:space-between;
padding:12px 0;
border-bottom:1px solid #eee;
}

.status-paid{
color:var(--success);
font-weight:bold;
}

.status-late{
color:var(--danger);
font-weight:bold;
}

.chart{
height:280px;
display:flex;
justify-content:center;
align-items:flex-end;
gap:12px;
}

.bar{
width:50px;
background:linear-gradient(var(--primary),var(--secondary));
border-radius:12px 12px 0 0;
}

.bar:nth-child(1){height:120px;}
.bar:nth-child(2){height:200px;}
.bar:nth-child(3){height:180px;}
.bar:nth-child(4){height:240px;}
.bar:nth-child(5){height:170px;}
.bar:nth-child(6){height:260px;}

.mobile-header{
display:none;
}

@media(max-width:900px){

.sidebar{
display:none;
}

.container{
display:block;
}

.mobile-header{
display:flex;
justify-content:space-between;
align-items:center;
padding:15px;
background:linear-gradient(90deg,var(--primary),var(--secondary));
color:white;
}

.content-grid{
grid-template-columns:1fr;
}

.main{
padding:15px;
}
}
</style>
</head>

<body>

<div class="mobile-header">
<h2>MONA</h2>
<div>☰</div>
</div>

<div class="container">

<aside class="sidebar">
<div class="logo">🎓 MONA</div>

<ul class="menu">

<li>👨‍🎓 الطلاب</li>
<li>📚 المجموعات</li>
<li>✅ الحضور</li>
<li>📝 الاختبارات</li>
<li>📖 المحتوى</li>
<li>💰 المدفوعات</li>
